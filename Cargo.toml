[workspace]
members = ["crates/rift-provider", "crates/rift-ollama", "crates/rift-openai", "crates/rift-anthropic", "crates/rift-core", "crates/rift-tui"]
resolver = "2"

[workspace.package]
version = "1.0.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
tokio-util = "0.7"

[profile.release]
lto = true
strip = true
codegen-units = 1
