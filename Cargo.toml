[workspace]
members = ["crates/rift-provider", "crates/rift-ollama", "crates/rift-openai", "crates/rift-anthropic", "crates/rift-core", "crates/rift-tui"]
resolver = "2"

[workspace.package]
version = "2.6.4"
edition = "2021"
license = "MIT"
repository = "https://github.com/exYze/rift"

[workspace.dependencies]
# Internal crates carry an explicit version so `cargo publish` works (path
# alone is stripped on publish). Keep in lockstep with workspace.version
# when bumping a release.
rift-provider = { path = "crates/rift-provider", version = "2.6.4" }
rift-ollama = { path = "crates/rift-ollama", version = "2.6.4" }
rift-openai = { path = "crates/rift-openai", version = "2.6.4" }
rift-anthropic = { path = "crates/rift-anthropic", version = "2.6.4" }
rift-core = { path = "crates/rift-core", version = "2.6.4" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
tokio-util = "0.7"

[profile.release]
lto = true
strip = true
codegen-units = 1
