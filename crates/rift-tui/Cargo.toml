[package]
name = "rift-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rift: a fast, flicker-free terminal coding agent for local Ollama models"

[[bin]]
name = "rift"
path = "src/main.rs"

[dependencies]
rift-core = { path = "../rift-core" }
rift-ollama = { path = "../rift-ollama" }
rift-openai = { path = "../rift-openai" }
rift-anthropic = { path = "../rift-anthropic" }
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive", "env"] }
ratatui = "0.29"
textwrap = "0.16"
ignore = "0.4"
# Pure-Rust build (fancy-regex, no onig C dep). Costs ~2.5MB of binary — the
# roadmap's size budget line — so it's flaggable: --no-default-features
# builds a lean binary with flat code coloring.
syntect = { version = "5", default-features = false, features = ["default-fancy"], optional = true }

[features]
default = ["highlight"]
highlight = ["dep:syntect"]
