# The desktop app is its own workspace on purpose: Tauri's dependency tree
# (webview glue, windowing) would roughly double the root workspace's build
# and lock churn, and nothing in crates/ depends on it. It talks to rift
# over the serve protocol, not by linking rift-core.
[package]
name = "rift-desktop"
version = "2.8.6"
edition = "2021"
license = "MIT"
repository = "https://github.com/exYze/rift"
description = "Rift desktop — a native shell for the rift coding agent"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[profile.release]
lto = true
strip = true
codegen-units = 1
