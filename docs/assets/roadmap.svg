    <text x="18" y="84" font-size="12" fill="#8b949e">· hydrate-on-demand: −18% tok</text>
    <text x="18" y="106" font-size="12" fill="#8b949e">· repo-map cache + centrality</text>
    <text x="18" y="128" font-size="12" fill="#8b949e">· idle-time compaction</text>
    <text x="18" y="150" font-size="12" fill="#8b949e">· hard-tier bench + judge bench</text>
  </g>
