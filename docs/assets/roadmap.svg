    <text x="18" y="84" font-size="12" fill="#8b949e">· native Ollama agent, zero shims</text>
    <text x="18" y="106" font-size="12" fill="#8b949e">· Compactor: 80% fewer tokens</text>
    <text x="18" y="128" font-size="12" fill="#8b949e">· WarpDrive worktree races</text>
    <text x="18" y="150" font-size="12" fill="#8b949e">· Provider trait: vLLM, llama.cpp</text>
  </g>
