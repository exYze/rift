  <text x="55" y="82" font-size="14" fill="#8b949e">the local-first coding agent — the road to 2.0</text>
  <text x="1225" y="56" font-size="13" fill="#8b949e" text-anchor="end">github.com/exYze/rift</text>
  <text x="1225" y="78" font-size="13" font-weight="700" fill="#3fb950" text-anchor="end">current: v2.4.1</text>

