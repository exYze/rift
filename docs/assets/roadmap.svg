    <text x="18" y="106" font-size="12" fill="#8b949e">· demo GIF in README ✓</text>
    <text x="18" y="128" font-size="12" fill="#8b949e">· CHANGELOG + templates ✓</text>
    <text x="18" y="150" font-size="12" fill="#8b949e">· next: winget, crates.io</text>
  </g>
  <g transform="translate(955,330)">
