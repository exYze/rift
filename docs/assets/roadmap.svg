    <rect width="270" height="170" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="178" y="16" width="74" height="20" rx="10" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="215" y="30" font-size="11" font-weight="700" fill="#8b949e" text-anchor="middle">shipped</text>
    <text x="18" y="32" font-size="16" font-weight="700" fill="#39c5cf">v0.5</text>
    <text x="18" y="54" font-size="14" font-weight="600" fill="#e6edf3">commands + UX</text>
    <text x="18" y="84" font-size="12" fill="#8b949e">· /retry /stats /system /save</text>
