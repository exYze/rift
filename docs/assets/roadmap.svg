<svg viewBox="0 0 1280 570" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1280" height="570" rx="14" fill="#0d1117"/>

  <!-- header -->
  <text x="55" y="56" font-size="28" font-weight="700" fill="#e6edf3">rift <tspan fill="#39c5cf">roadmap</tspan></text>
  <text x="55" y="82" font-size="14" fill="#8b949e">the local-first coding agent — where it's headed</text>
  <text x="1225" y="56" font-size="13" fill="#8b949e" text-anchor="end">github.com/exYze/rift</text>
  <text x="1225" y="78" font-size="13" font-weight="700" fill="#39c5cf" text-anchor="end">current: v0.9.1</text>

  <!-- row 1 -->
  <g transform="translate(55,110)">
    <rect width="270" height="170" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="178" y="16" width="74" height="20" rx="10" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="215" y="30" font-size="11" font-weight="700" fill="#8b949e" text-anchor="middle">shipped</text>
    <text x="18" y="32" font-size="16" font-weight="700" fill="#39c5cf">v0.3</text>
    <text x="18" y="54" font-size="14" font-weight="600" fill="#e6edf3">the foundation</text>
    <text x="18" y="84" font-size="12" fill="#8b949e">· native Ollama agent, zero shims</text>
    <text x="18" y="106" font-size="12" fill="#8b949e">· Compactor: 80% fewer tokens</text>
    <text x="18" y="128" font-size="12" fill="#8b949e">· WarpDrive worktree races</text>
    <text x="18" y="150" font-size="12" fill="#8b949e">· MCP + 23 slash commands</text>
  </g>
  <g transform="translate(355,110)">
    <rect width="270" height="170" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="178" y="16" width="74" height="20" rx="10" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="215" y="30" font-size="11" font-weight="700" fill="#8b949e" text-anchor="middle">shipped</text>
    <text x="18" y="32" font-size="16" font-weight="700" fill="#39c5cf">v0.4</text>
    <text x="18" y="54" font-size="14" font-weight="600" fill="#e6edf3">plan view + trust</text>
    <text x="18" y="84" font-size="12" fill="#8b949e">· live task checklist in the TUI</text>
    <text x="18" y="106" font-size="12" fill="#8b949e">· approval mode for write/bash</text>
    <text x="18" y="128" font-size="12" fill="#8b949e">· full input-line editing</text>
    <text x="18" y="150" font-size="12" fill="#8b949e">· RIFT.md auto-loaded</text>
  </g>
