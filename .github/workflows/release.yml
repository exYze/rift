name: release

# Two ways in: push a v* tag (manual release, as always), or merge a version
# bump to master — the plan job spots a Cargo.toml version with no matching
# tag and releases it automatically, so cutting a release is just merging
# the bump PR. Master pushes whose version is already tagged skip everything.
on:
  push:
    tags: ["v*"]
    branches: [master]

permissions:
  contents: write

jobs:
  plan:
    name: plan release
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.decide.outputs.go }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: decide
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          tag="v${version}"
          if [ -z "$version" ]; then
            echo "could not read workspace version from Cargo.toml — not releasing"
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already released — nothing to do"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "new version $version on master — releasing as $tag"
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          # Intel runners are deprecated/scarce — cross-compile from arm64.
          - os: macos-14
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: install rust target
        shell: bash
        timeout-minutes: 15
        run: |
          for i in 1 2 3; do
            rustup update stable && rustup target add ${{ matrix.target }} && exit 0
            echo "rustup attempt $i failed; retrying in $((i * 10))s" && sleep $((i * 10))
          done
          exit 1

      # Static Linux binaries: no glibc version requirements, run anywhere.
      - name: install musl toolchain
        if: contains(matrix.target, 'musl')
        timeout-minutes: 15
        run: |
          # `timeout` is what makes the retry loop worth anything: a hosted
          # runner's apt mirror can hang after printing the mirrorlist and
          # never return, and a retry around a command that never returns
          # retries nothing. v2.8.0's release sat on this for 23 minutes.
          # `sudo timeout`, NOT `timeout sudo`: timeout signals its direct
          # child, and an unprivileged process cannot signal a root-owned
          # sudo (EPERM), so `timeout sudo …` waits forever on a hung apt --
          # a dev-build burned the full 6h job limit proving it. Under sudo,
          # timeout runs as root and can actually kill apt-get.
          for i in 1 2 3; do
            sudo timeout -k 30 180 apt-get update \
              && sudo timeout -k 30 180 apt-get install -y musl-tools \
              && exit 0
            echo "apt-get attempt $i failed; retrying in $((i * 10))s" && sleep $((i * 10))
          done
          exit 1

      - name: build
        run: cargo build --release --target ${{ matrix.target }} -p rift-tui
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          # The whole point of the musl targets is a binary that runs on any
          # Linux. rustc links x86_64-musl as a static PIE by default, and
          # musl-gcc's specs then stamp `/lib/ld-musl-x86_64.so.1` into it as
          # the interpreter — on a glibc host the kernel can't find that
          # loader and exec fails with ENOENT, which the shell reports as the
          # baffling `rift: not found` for a file that is plainly there.
          # (aarch64-musl links non-PIE and was unaffected, which is why only
          # half the Linux downloads were broken.) relocation-model=static
          # takes the plain `-static` path instead.
          RUSTFLAGS: ${{ contains(matrix.target, 'musl') && '-C target-feature=+crt-static -C relocation-model=static' || '' }}

      # Never ship a "static" binary that isn't. A PT_INTERP segment means it
      # needs a loader at runtime; that is exactly the bug above, and it is
      # invisible until someone on a glibc box downloads it.
      - name: verify the musl binary is static
        if: contains(matrix.target, 'musl')
        run: |
          bin="target/${{ matrix.target }}/release/rift"
          if readelf -l "$bin" | grep -q "INTERP"; then
            readelf -l "$bin" | grep -A2 "INTERP"
            echo "::error::$bin is dynamically linked — it will fail with 'not found' on hosts without a musl loader"
            exit 1
          fi
          if readelf -d "$bin" 2>/dev/null | grep -q "NEEDED"; then
            readelf -d "$bin" | grep "NEEDED"
            echo "::error::$bin needs shared libraries — not portable"
            exit 1
          fi
          echo "static: no PT_INTERP, no DT_NEEDED"

      # Archives for the install script + raw binaries for `rift update`.
      - name: package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf "$GITHUB_WORKSPACE/rift-${{ matrix.target }}.tar.gz" rift
          cp rift "$GITHUB_WORKSPACE/rift-${{ matrix.target }}"

      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/rift.exe" -DestinationPath "rift-${{ matrix.target }}.zip"
          Copy-Item "target/${{ matrix.target }}/release/rift.exe" "rift-${{ matrix.target }}.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: rift-${{ matrix.target }}
          path: |
            rift-${{ matrix.target }}.*
            rift-${{ matrix.target }}
          if-no-files-found: error

  # The VS Code extension ships alongside the binaries: install with
  # `code --install-extension rift-vscode.vsix`.
  vsix:
    name: package vscode extension
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: package
        shell: bash
        run: |
          for i in 1 2 3; do
            (cd vscode && npx --yes @vscode/vsce package --out ../rift-vscode.vsix) && exit 0
            echo "vsce package attempt $i failed; retrying in $((i * 10))s" && sleep $((i * 10))
          done
          exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: rift-vscode
          path: rift-vscode.vsix
          if-no-files-found: error

  # Transient-flake recovery. The per-step retries above cover the network
  # calls we run in a shell, but the `actions/upload-artifact` upload itself
  # is a JS action that can't be wrapped in a shell retry — and a DNS blip
  # reaching its endpoint (ENOTFOUND) is exactly what once failed one matrix
  # leg and skipped the whole release. When any build/vsix leg fails, re-run
  # just the failed jobs (and their dependents, i.e. release), capped at 3
  # attempts via run_attempt so a genuine, reproducible failure still stops.
  auto-rerun:
    needs: [build, vsix]
    if: failure() && github.run_attempt < 3
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: re-run failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "A job failed on attempt ${{ github.run_attempt }} of 3 — re-running failed jobs."
          gh run rerun ${{ github.run_id }} --failed --repo ${{ github.repository }}

  release:
    needs: [plan, build, vsix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        run: cd dist && sha256sum * > checksums.txt

      # On a master-push release the tag doesn't exist yet: creating the
      # release creates it, pinned to the exact merged commit. (A tag made
      # with GITHUB_TOKEN can't retrigger this workflow, which is also why
      # the build happens in this same run.)
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true

  # Publish the extension to the VS Code Marketplace. No-ops (successfully)
  # until the VSCE_PAT secret exists — an Azure DevOps PAT with
  # Marketplace→Manage scope for the exYze publisher.
  marketplace:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: publish to marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT not set — skipping marketplace publish"
            exit 0
          fi
          cd vscode && npx --yes @vscode/vsce publish -p "$VSCE_PAT"

  # Publish the library crates to crates.io in dependency order. No-ops
  # (successfully) until the CARGO_REGISTRY_TOKEN secret exists. An
  # already-published version warns instead of failing, so release re-runs
  # stay green.
  crates:
    needs: [plan, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN not set — skipping crates.io publish"
            exit 0
          fi
          rustup update stable
          for crate in rift-provider rift-ollama rift-openai rift-anthropic rift-core; do
            cargo publish -p "$crate" ||
              echo "::warning::cargo publish $crate failed (already published?)"
          done

  # Update the winget manifest for this release and submit the version PR
  # to microsoft/winget-pkgs. No-ops (successfully) until the WINGET_TOKEN
  # secret exists — a classic PAT with public_repo. The FIRST submission of
  # the package must be manual (see packaging/winget/README.md); this job
  # handles every version bump after that.
  winget:
    needs: [plan, release]
    runs-on: windows-latest
    steps:
      - name: submit winget version update
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Host "WINGET_TOKEN not set - skipping winget submission"
            exit 0
          }
          $version = $env:TAG.TrimStart("v")
          $url = "https://github.com/exYze/rift/releases/download/$($env:TAG)/rift-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile wingetcreate.exe
          .\wingetcreate.exe update exYze.rift --version $version --urls $url --token $env:WINGET_TOKEN --submit
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::wingetcreate update failed (first-time submissions are manual - packaging/winget/README.md)"
            exit 0
          }

  # Regenerate the Homebrew formula from the just-published checksums and
  # push it to exYze/homebrew-tap. No-ops (successfully) until the
  # TAP_PUSH_TOKEN secret exists — a fine-grained PAT with contents:write
  # on the tap repo.
  homebrew-tap:
    needs: [plan, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: update tap formula
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          if [ -z "$TAP_PUSH_TOKEN" ]; then
            echo "TAP_PUSH_TOKEN not set — skipping tap update"
            exit 0
          fi
          scripts/make_formula.sh "$TAG" > rift.rb
          git clone "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/exYze/homebrew-tap.git" tap
          mkdir -p tap/Formula
          mv rift.rb tap/Formula/rift.rb
          cd tap
          git -c user.email=bot@rift -c user.name=rift-release add Formula/rift.rb
          git -c user.email=bot@rift -c user.name=rift-release commit -m "rift $TAG" || exit 0
          git push
