name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          # Intel runners are deprecated/scarce — cross-compile from arm64.
          - os: macos-14
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - name: install rust target
        run: rustup update stable && rustup target add ${{ matrix.target }}

      # Static Linux binaries: no glibc version requirements, run anywhere.
      - name: install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: build
        run: cargo build --release --target ${{ matrix.target }} -p rift-tui
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc

      # Archives for the install script + raw binaries for `rift update`.
      - name: package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf "$GITHUB_WORKSPACE/rift-${{ matrix.target }}.tar.gz" rift
          cp rift "$GITHUB_WORKSPACE/rift-${{ matrix.target }}"

      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/rift.exe" -DestinationPath "rift-${{ matrix.target }}.zip"
          Copy-Item "target/${{ matrix.target }}/release/rift.exe" "rift-${{ matrix.target }}.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: rift-${{ matrix.target }}
          path: |
            rift-${{ matrix.target }}.*
            rift-${{ matrix.target }}
          if-no-files-found: error

  # The VS Code extension ships alongside the binaries: install with
  # `code --install-extension rift-vscode.vsix`.
  vsix:
    name: package vscode extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: package
        run: cd vscode && npx --yes @vscode/vsce package --out ../rift-vscode.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: rift-vscode
          path: rift-vscode.vsix
          if-no-files-found: error

  release:
    needs: [build, vsix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        run: cd dist && sha256sum * > checksums.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  # Publish the extension to the VS Code Marketplace. No-ops (successfully)
  # until the VSCE_PAT secret exists — an Azure DevOps PAT with
  # Marketplace→Manage scope for the exYze publisher.
  marketplace:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: publish to marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT not set — skipping marketplace publish"
            exit 0
          fi
          cd vscode && npx --yes @vscode/vsce publish -p "$VSCE_PAT"

  # Regenerate the Homebrew formula from the just-published checksums and
  # push it to exYze/homebrew-tap. No-ops (successfully) until the
  # TAP_PUSH_TOKEN secret exists — a fine-grained PAT with contents:write
  # on the tap repo.
  homebrew-tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: update tap formula
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$TAP_PUSH_TOKEN" ]; then
            echo "TAP_PUSH_TOKEN not set — skipping tap update"
            exit 0
          fi
          scripts/make_formula.sh "$TAG" > rift.rb
          git clone "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/exYze/homebrew-tap.git" tap
          mkdir -p tap/Formula
          mv rift.rb tap/Formula/rift.rb
          cd tap
          git -c user.email=bot@rift -c user.name=rift-release add Formula/rift.rb
          git -c user.email=bot@rift -c user.name=rift-release commit -m "rift $TAG" || exit 0
          git push
