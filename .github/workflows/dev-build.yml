name: dev-build

# Build downloadable binaries for manually testing a branch without cutting a
# release. Trigger from the Actions tab (Run workflow) or:
#   gh workflow run dev-build.yml --ref <branch>
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p rift-tui
      - uses: actions/upload-artifact@v7
        with:
          name: rift-windows-dev
          path: target/release/rift.exe
          if-no-files-found: error

  # Linux is here to prove the musl binary is genuinely static BEFORE it
  # reaches a release. v2.8.1 shipped an x86_64 build that needed
  # /lib/ld-musl-x86_64.so.1 and died with "not found" on every glibc host.
  linux-musl:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup target add x86_64-unknown-linux-musl
      - name: install musl toolchain
        timeout-minutes: 15
        run: |
          # `sudo timeout`, NOT `timeout sudo`: timeout signals its direct
          # child, and an unprivileged process cannot signal a root-owned
          # sudo (EPERM), so `timeout sudo …` waits forever on a hung apt --
          # a dev-build burned the full 6h job limit proving it. Under sudo,
          # timeout runs as root and can actually kill apt-get.
          for i in 1 2 3; do
            sudo timeout -k 30 180 apt-get update \
              && sudo timeout -k 30 180 apt-get install -y musl-tools \
              && exit 0
            echo "apt-get attempt $i failed; retrying in $((i * 10))s" && sleep $((i * 10))
          done
          exit 1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target x86_64-unknown-linux-musl -p rift-tui
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          RUSTFLAGS: -C target-feature=+crt-static -C relocation-model=static
      - name: verify the binary is static and actually runs
        run: |
          bin=target/x86_64-unknown-linux-musl/release/rift
          file "$bin"
          readelf -l "$bin" | grep -q INTERP && { echo "::error::dynamically linked"; exit 1; }
          readelf -d "$bin" 2>/dev/null | grep NEEDED && { echo "::error::needs shared libs"; exit 1; }
          # The runner is glibc-only, so this is the real test: a musl binary
          # with a stray interpreter cannot exec here.
          "$bin" --version
      - uses: actions/upload-artifact@v7
        with:
          name: rift-linux-musl-dev
          path: target/x86_64-unknown-linux-musl/release/rift
          if-no-files-found: error
