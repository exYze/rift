name: desktop-build

# Build rift-desktop bundles on demand (and on desktop/ changes) — kept out
# of the main release matrix so the CLI release cadence never waits on the
# heavier Tauri builds. Artifacts land on the run; wiring them into the
# release itself can come once the app stabilizes.
on:
  workflow_dispatch:
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop-build.yml"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            bundles: nsis
          - os: macos-14
            bundles: dmg
          - os: ubuntu-22.04
            bundles: appimage,deb
    steps:
      - uses: actions/checkout@v7

      - name: install linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: build bundles
        working-directory: desktop/src-tauri
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: smoke test (windows)
        if: runner.os == 'Windows'
        working-directory: desktop/src-tauri
        env:
          RIFT_DESKTOP_SMOKE: "1"
        run: ./target/release/rift-desktop.exe

      - uses: actions/upload-artifact@v4
        with:
          name: rift-desktop-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.dmg
            desktop/src-tauri/target/release/bundle/**/*.AppImage
            desktop/src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: warn
